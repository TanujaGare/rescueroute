name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + syntax/XSS guards)
        run: npm run lint
      - name: Tests with coverage (Gemini mocked; no secrets needed)
        run: npm run test:coverage
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
